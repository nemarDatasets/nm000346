file_format: EEGLAB .set
methodology: 'Factorial experimental design with 12 healthy participants. EEG recorded with BrainProducts LiveAmp 32-channel
  system at 500 Hz. Four conditions tested: burst c-VEP and m-sequence c-VEP, each at 100% and 40% amplitude depth. Participants
  focused on cued targets (4 classes) in 15 blocks of 4 trials per condition. CNN-based decoding with 250ms sliding windows.
  Subjective ratings collected for visual comfort, mental tiredness, and intrusiveness. VEP analysis included amplitude, latency,
  and inter-trial coherence metrics.'
