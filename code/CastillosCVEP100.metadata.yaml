abstract: The utilization of aperiodic flickering visual stimuli under the form of code-modulated Visual Evoked Potentials
  (c-VEP) represents a pivotal advancement in the field of reactive Brain–Computer Interface (rBCI). This study introduces
  an innovative variant of code-VEP, referred to as 'Burst c-VEP', involving the presentation of short bursts of aperiodic
  visual flashes at a deliberately slow rate, typically ranging from two to four flashes per second. The proposed solutions
  were tested through an offline 4-classes c-VEP protocol involving 12 participants. The full amplitude burst c-VEP sequences
  exhibited higher accuracy, ranging from 90.5% (with 17.6 s of calibration data) to 95.6% (with 52.8 s of calibration data),
  compared to its m-sequence counterpart (71.4% to 85.0%). The mean selection time for both types of codes (1.5 s) compared
  favorably to reports from previous studies. Lowering the intensity of the stimuli only slightly decreased the accuracy of
  the burst code sequences to 94.2% while leading to substantial improvements in terms of user experience.
